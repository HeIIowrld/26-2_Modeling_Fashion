[pytest]
# 루트에서 `pytest` 한 번으로 두 묶음을 모두 돌린다.
#   ai_fashion_recommender/tests  추천·분석·합성 로직
#   web/tests                     FastAPI 엔드포인트와 화면 동작
testpaths = ai_fashion_recommender/tests web/tests

# 이 저장소는 OneDrive 바탕화면 폴더와 겹쳐 있어서 로컬 보관물이 같이 놓인다.
# 특히 backup_before_sync_* 는 옛 src 사본이라, 수집되면 web 패키지를 가려
# `import web.app` 이 ModuleNotFoundError 로 죽는다. 실제로 제외 없이 루트에서
# 돌리면 수집 오류 21개가 났고, 제외하면 891개가 통과한다(2026-09-28).
norecursedirs =
    backup_before_sync_*
    tmp
    third_party
    packages
    datasets
    .git
    .venv*
    __pycache__
    *.egg-info

# 실패 원인을 바로 보여 준다. -q 는 호출할 때 붙인다.
addopts = -ra --strict-markers
